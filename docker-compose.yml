version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: fitgenius_db
    restart: always
    environment:
      POSTGRES_USER: fitgenius
      POSTGRES_PASSWORD: fitgenius_password
      POSTGRES_DB: fitgenius_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitgenius -d fitgenius_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fitgenius_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://fitgenius:fitgenius_password@db:5432/fitgenius_ai
      SECRET_KEY: fitgenius_super_secure_jwt_token_key_prod_2026
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: gpt-4o-mini
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fitgenius_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
